# Local full-stack demonstration.
#   docker compose up --build                         -> API + interface
#   docker compose --profile automation up --build    -> + n8n (http://localhost:5678)
# Secrets come from .env (python scripts/bootstrap_env.py creates it).

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    environment:
      DATA_DIR: /app/data
      N8N_CALLBACK_BASE_URL: http://backend:8000
    volumes:
      - app_data:/app/data
      - hf_cache:/home/app/.cache/huggingface
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.6
    profiles: ["automation"]
    environment:
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      N8N_HOST: localhost
      N8N_PORT: "5678"
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"   # local HTTP only; use HTTPS and remove this in any deployment
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    restart: unless-stopped

volumes:
  app_data:
  hf_cache:
  n8n_data:
